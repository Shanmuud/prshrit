<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: answer-sheet column. Topic heat list on top (doubles as filter), then question slips grouped by topic. */
:root{
  --bg:#f5f7fa; --paper:#ffffff; --ink:#17202e; --muted:#5d6878; --line:#dde2ea; --accent:#2b54c9; --accent-soft:#e6ecfb;
  --easy:#138a5b; --easy-bg:#e2f4ec; --med:#b8740a; --med-bg:#fbefd9; --hard:#c4343f; --hard-bg:#fbe3e5;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --paper:#171d27; --ink:#e3e8f0; --muted:#97a2b3; --line:#2a3240; --accent:#7f9dff; --accent-soft:#1f2a45;
  --easy:#4fd19a; --easy-bg:#12301f; --med:#f0b44e; --med-bg:#33270f; --hard:#ff7a83; --hard-bg:#3a1a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --paper:#171d27; --ink:#e3e8f0; --muted:#97a2b3; --line:#2a3240; --accent:#7f9dff; --accent-soft:#1f2a45;
  --easy:#4fd19a; --easy-bg:#12301f; --med:#f0b44e; --med-bg:#33270f; --hard:#ff7a83; --hard-bg:#3a1a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:920px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
header{display:grid;gap:6px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(26px,5vw,36px)/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:500 18px/1.2 var(--display);margin:0}
.sub{color:var(--muted);margin:0;max-width:65ch}
.sub a{color:var(--accent)}
.papers{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.papers a{font:500 12px/1 var(--mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:6px 9px;border-radius:4px;background:var(--paper)}
.papers a:hover{color:var(--accent);border-color:var(--accent)}
section.heat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px}
.heat-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rows{display:grid;gap:4px}
.row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 70px;gap:12px;align-items:center;padding:6px 8px;border-radius:6px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row:focus-visible,.chip:focus-visible,.slip summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row .name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.row .n{font:500 13px/1 var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .lab{font:500 12px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px/1 var(--body);padding:7px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{margin-left:auto;font:13px var(--mono);color:var(--muted)}
.group{display:grid;gap:10px}
.group h2 small{font:400 13px var(--mono);color:var(--muted);margin-left:8px}
.slip{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.slip summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 16px}
.slip summary::-webkit-details-marker{display:none}
.qno{font:500 13px/1.4 var(--mono);color:var(--accent);white-space:nowrap}
.qno small{display:block;color:var(--muted);font-size:11px}
.gist{min-width:0}
.gist .st{font-weight:600}
.gist p{margin:2px 0 0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slip[open] .gist p{display:none}
.side{display:grid;gap:6px;justify-items:end}
.pill{font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill.Easy{color:var(--easy);background:var(--easy-bg)} .pill.Medium{color:var(--med);background:var(--med-bg)} .pill.Hard{color:var(--hard);background:var(--hard-bg)}
.marks{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.body{padding:0 16px 16px;display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.qtext{white-space:pre-wrap;font:14px/1.6 var(--body);margin:0;max-width:72ch;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font:12px var(--mono);color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin:0}
.lc{display:flex;flex-wrap:wrap;gap:8px}
.lc a{font:500 13px/1 var(--body);color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:6px 10px;border-radius:4px}
.lc a:hover{background:var(--accent-soft)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:560px){.row{grid-template-columns:100px 1fr 44px}.slip summary{grid-template-columns:1fr auto}.qno{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .3s}}
</style>

g as\nnecessary.\nAt each step (after every insertion and deletion), show the balance factor of each node.", "marks": 5, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "AVL insertion/deletion", "difficulty": "Easy", "leetcode": [], "reason": "Hand-trace AVL insertion of seven given keys, then two deletions, showing rotations and balance factors. The keys and operations are supplied, so this is a trace with no implementation. It is long but stays Easy. The catalog has no AVL match, and #108 does not maintain AVL balance."}, {"id": "8b4d5c3fd01cac31-1B", "paper_id": "8b4d5c3fd01cac31", "qno": "1B", "text": "You are required to implement four stacks in an array of size 20. Assume the following initial\ndeclarations.\nelement memory[20]; // Global memory declaration\nint top[4];\nint boundary[4];\nAnswer the following.\ni) Write the C code snippet required to initialize the top and boundary of each stack.\nii) Develop the C function to push an element into the ith stack.\niii) Develop the C function to pop an element from the ith stack.", "marks": 3, "co": "CO3", "cognitive_level": "Application", "topic": "Stack", "subtopic": "Array/list implementation", "difficulty": "Medium", "leetcode": [], "reason": "Implementing four stacks requires a consistent shared-array partition scheme across initialization, push and pop, with distinct empty and full bounds for every stack, including the last partition. This is a complete adaptation of a stack implementation with several coupled index invariants, rather than one supplied push/pop operation. Fixed partitions suffice; dynamic space sharing is not required, so Hard is not justified."}, {"id": "8b4d5c3fd01cac31-1C", "paper_id": "8b4d5c3fd01cac31", "qno": "1C", "text": "Write a C program to read and display employee details including the date of joining using nested\nstructure. Consider date of joining as nested structure.", "marks": 2, "co": "CO1", "cognitive_level": "Application", "topic": "Data structure fundamentals", "subtopic": "Nested structures", "difficulty": "Easy", "leetcode": [], "reason": "Declare a nested C struct (employee containing a date struct) and read and print its fields. This is basic user-defined record syntax with no algorithm. No coding-problem match applies."}, {"id": "8b4d5c3fd01cac31-2A", "paper_id": "8b4d5c3fd01cac31", "qno": "2A", "text": "Write a function to convert an infix expression to postfix. Include the following functions as per the\nprototype.\ni) int InStackPrecedence(char op) ; to return the precedence of operator within the stack\nii) int IncomingPrecedence(char op); to return the precedence of the incoming operator.\niii) void Infix_Postfix(char infix[], char postfix[]); to convert given infix expression to postfix.\nMain function not required.\nNote: The infix expression may include ONLY the following operators (listed in the order of their\nprecedence):\n• ^ (exponentiation) → right associative\n• * (multiplication), / (division) → left associative\n• + (addition), - (subtraction) → left associative", "marks": 5, "co": "CO3", "cognitive_level": "Application", "topic": "Stack", "subtopic": "Expression conversion", "difficulty": "Medium", "leetcode": [], "reason": "Implement stack-based infix-to-postfix conversion. The in-stack and incoming precedence functions must handle right-associative ^ correctly alongside the left-associative operators. Precedence and associativity cases make it Medium. #150 evaluates postfix and does not convert infix, so it is not a match."}, {"id": "8b4d5c3fd01cac31-2B", "paper_id": "8b4d5c3fd01cac31", "qno": "2B", "text": "i. Write a C function to perform a level-order traversal for the binary tree.\nii. Determine the inorder, preorder, and postorder traversal node sequences for the given binary\ntree in Fig.Q.2B.", "marks": 3, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "Binary tree traversal", "difficulty": "Easy", "leetcode": [{"id": 102, "title": "Binary Tree Level Order Traversal", "slug": "binary-tree-level-order-traversal"}], "reason": "Write a queue-based level-order traversal, a standard single operation, and trace the three depth-first traversals. Fig.Q.2B was lost in extraction, so part (ii) cannot be checked against the actual tree. #102 matches part (i)."}, {"id": "8b4d5c3fd01cac31-2C", "paper_id": "8b4d5c3fd01cac31", "qno": "2C", "text": "Write a C program to dynamically allocate memory for 2D string arrays (array of strings) and\nperform concatenation using pointers.", "marks": 2, "co": "CO1", "cognitive_level": "Application", "topic": "Data structure fundamentals", "subtopic": "Static/dynamic allocation", "difficulty": "Easy", "leetcode": [], "reason": "Use malloc to allocate an array of strings, then concatenate them through pointer manipulation. This assesses basic dynamic allocation and pointer use, with no algorithmic difficulty. No catalog problem matches."}, {"id": "8b4d5c3fd01cac31-3A", "paper_id": "8b4d5c3fd01cac31", "qno": "3A", "text": "i) Write a function to perform the Transpose computation of a given sparse matrix using linked list.\nii) Demonstrate complete step-by-step process to compute the transpose of the given in Fig.Q.3A\nsparse matrix using the above function.", "marks": 5, "co": "CO1", "cognitive_level": "Application", "topic": "Sparse matrix/Polynomial", "subtopic": "Sparse transpose", "difficulty": "Medium", "leetcode": [], "reason": "Write a transpose for a linked-list sparse matrix. The function must swap row and column in each node and produce the result in row-major order, which needs list construction or ordering across nodes. Part (ii) traces this function on a matrix, but Fig.Q.3A was lost in extraction. The catalog has no sparse-matrix match."}, {"id": "8b4d5c3fd01cac31-3B", "paper_id": "8b4d5c3fd01cac31", "qno": "3B", "text": "In a gaming leaderboard system, players' scores are maintained in a Binary Search Tree (BST) for\nefficient ranking and updates. Write an iterative function to delete a player's score from the BST\nwhen the player leaves the game or their record needs to be removed.\nDelete the score 30 from the BST given below and illustrate the resulting tree structure after\ndeletion.", "marks": 3, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "BST insertion/deletion", "difficulty": "Medium", "leetcode": [{"id": 450, "title": "Delete Node in a BST", "slug": "delete-node-in-a-bst"}], "reason": "Write iterative BST deletion with parent tracking. It must handle the leaf, one-child, and two-child (successor or predecessor) cases, then trace deleting key 30. The several cases make it Medium. The given BST diagram was lost in extraction, so the trace cannot be checked. #450 matches; it is commonly solved recursively."}, {"id": "8b4d5c3fd01cac31-3C", "paper_id": "8b4d5c3fd01cac31", "qno": "3C", "text": "Write a C function bool isDuplicate(char s[]) that detects duplicate parentheses in a given\nexpression using a stack.", "marks": 2, "co": "CO3", "cognitive_level": "Analysis", "topic": "Stack", "subtopic": "Balanced delimiters", "difficulty": "Medium", "leetcode": [{"id": 20, "title": "Valid Parentheses", "slug": "valid-parentheses"}], "reason": "Adapt stack-based delimiter matching to detect redundant parentheses. On each ')', pop to the matching '('; if nothing lay between them, the pair is a duplicate. Ordinary balance checking does not detect this, so the adaptation makes it Medium. #20 is a partial analogy: it covers the same stack pattern but only checks validity."}, {"id": "8b4d5c3fd01cac31-4A", "paper_id": "8b4d5c3fd01cac31", "qno": "4A", "text": "A mobile app named \"MIT-BLR Connect\" maintains contact details of alumni in three different\nmodules:\ni) Add Recent Contacts Module: Displays recently interacted alumni in order of contact - new ones\nadded at the beginning.\nii) Traverse Module: Allows viewing alumni details in forward direction.\niii) Develop a module to print the data in reverse order.\nDevelop C functions considering singly linked list as the suitable data structure", "marks": 5, "co": "CO2", "cognitive_level": "Analysis", "topic": "Singly LL", "subtopic": "Insertion/deletion", "difficulty": "Easy", "leetcode": [{"id": 707, "title": "Design Linked List", "slug": "design-linked-list"}], "reason": "Write singly linked list insertion at the head, forward traversal, and reverse-order printing, which can use recursion or a stack without relinking. All three are familiar single operations. #707 is a partial match: it covers addAtHead and traversal in a singly linked representation, but not reverse printing."}, {"id": "8b4d5c3fd01cac31-4B", "paper_id": "8b4d5c3fd01cac31", "qno": "4B", "text": "Consider the following expression to construct an expression tree.\n\nProvide the sequence of symbols generated by performing a pre-order traversal of this specific\nexpression tree.", "marks": 3, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "Binary tree traversal", "difficulty": "Easy", "leetcode": [{"id": 144, "title": "Binary Tree Preorder Traversal", "slug": "binary-tree-preorder-traversal"}], "reason": "Build an expression tree from an infix expression and list its preorder (prefix) sequence. This is hand simulation. The expression itself was lost in extraction, so this tag is provisional and the answer cannot be checked. #144 is a partial analogy because it does not construct the expression tree."}, {"id": "8b4d5c3fd01cac31-4C", "paper_id": "8b4d5c3fd01cac31", "qno": "4C", "text": "Consider the following binary tree structure\n\nIdentify all the leaf nodes in the provided tree structure. Develop a C function for counting the\nnumber of leaf nodes.", "marks": 2, "co": "CO4", "cognitive_level": "Analysis", "topic": "Trees", "subtopic": "Binary tree properties", "difficulty": "Easy", "leetcode": [], "reason": "Identify the leaves of a given tree and write a recursive leaf-count function, a basic recursive traversal. The tree diagram was lost in extraction. The catalog has no leaf-count problem, and #104 computes depth instead."}, {"id": "8b4d5c3fd01cac31-5A", "paper_id": "8b4d5c3fd01cac31", "qno": "5A", "text": "Consider the directed graph shown below, representing a set of tasks A,B,C,D,E,F,G,H and their\ndependencies (edges indicate direction of dependency).\n\nConsider the source vertex as A . The traversal order should be alphabetical order.\ni) Construct Adjacency List for the given graph by inserting the adjacent nodes in alphabetical\norder.\nii) Show the order of traversal of vertices using DFS.\niii) Develop recursive C function for performing DFS.\nCheck the existence of spanning tree.", "marks": 5, "co": "CO5", "cognitive_level": "Analysis", "topic": "Graphs", "subtopic": "DFS", "difficulty": "Easy", "leetcode": [{"id": 1971, "title": "Find if Path Exists in Graph", "slug": "find-if-path-exists-in-graph"}], "reason": "Build an adjacency list, trace DFS from A in alphabetical order, write recursive DFS, and check whether every vertex is reachable from A, which decides whether a spanning tree exists. The representation part is a secondary topic. Each part is a trace or a familiar operation. The graph diagram was lost in extraction. #1971 is a partial analogy: DFS reachability on an undirected graph."}, {"id": "8b4d5c3fd01cac31-5B", "paper_id": "8b4d5c3fd01cac31", "qno": "5B", "text": "A hospital wants to maintain a dynamic list of patients waiting for a doctor.\nSince the number of patients keeps changing (patients arrive and get treated at different times), a\nDoubly Linked List is chosen to manage this queue efficiently.\nEach node in the list should store:\n• Patient ID\n• Patient Name\nDesign the C functions for the following operations:\ni) Adding a new patient at the end of the list.\nii) Removing a patient from the front (when treatment is done).\nDisplaying the current waiting list.", "marks": 3, "co": "CO2", "cognitive_level": "Application", "topic": "Doubly LL", "subtopic": "Insertion/deletion", "difficulty": "Easy", "leetcode": [{"id": 707, "title": "Design Linked List", "slug": "design-linked-list"}], "reason": "Write doubly linked list insertion at the tail, deletion at the head, and display, which together act as a queue. Each is a familiar operation; the only extra care is updating prev and next pointers and handling the empty list. #707 is a partial match when solved with a doubly linked representation."}, {"id": "8b4d5c3fd01cac31-5C", "paper_id": "8b4d5c3fd01cac31", "qno": "5C", "text": "A Priority Queue is a special type of queue where each element is associated with a priority.\nElements with higher priority are dequeued before elements with lower priority, even if they were\nadded later.\n(a) Explain the concept of a Priority Queue and how it differs from a regular queue.\n(b) Given the following elements with priorities:\n(10, 3), (20, 1), (30, 2) (where the first value is the element, and the second value is the priority).\nShow the order in which these elements would be dequeued from the priority queue, assuming\nhigher priority means smaller priority number.", "marks": 2, "co": "CO3", "cognitive_level": "Analysis", "topic": "Queue", "subtopic": "Priority queue", "difficulty": "Easy", "leetcode": [], "reason": "Define a priority queue, contrast it with a FIFO queue, and trace the dequeue order of three elements: 20, then 30, then 10. This is a definition plus a trivial trace with no implementation, so no coding match applies."}, {"id": "d3fd200e4d245bfb-1A", "paper_id": "d3fd200e4d245bfb", "qno": "1A", "text": "An AVL Tree is created by inserting the following keys in Chronological order:\nO, G, T, E, L, Y, Z.\nAfter successful insertion, the key G is deleted.\nAnalyze and show:\ni. The structure of the AVL tree before and after deletion.\nii. Identify the type of imbalance.Specify the rotation(s) used to restore balance.", "marks": 5, "co": "CO4", "cognitive_level": "Analysis", "topic": "Trees", "subtopic": "AVL insertion/deletion", "difficulty": "Easy", "leetcode": [], "reason": "Hand-trace of AVL insertion then deletion on supplied keys. Inserting Z causes an RR imbalance at T, fixed by a single left rotation, which gives O(G(E,L), Y(T,Z)). Deleting G (replaced by its inorder successor L or predecessor E) leaves the tree balanced. Pure trace, so Easy. No catalog problem covers AVL maintenance."}, {"id": "d3fd200e4d245bfb-1B", "paper_id": "d3fd200e4d245bfb", "qno": "1B", "text": "Suppose two queues, Q1 and Q2, are implemented in a single array of size 10 using the method\nwhere Q1 grows from left to right and Q2 grows from right to left. Initially, both are empty. If 4\nelements are enqueued into Q1 and 3 elements into Q2, what are the possible indices of front1 and\nfront2? Demonstrate your answer with a neat diagram.", "marks": 3, "co": "CO3", "cognitive_level": "Application", "topic": "Queue", "subtopic": "Linear queue", "difficulty": "Easy", "leetcode": [], "reason": "Trace index positions for two linear queues sharing one array and growing from opposite ends. Only pointer bookkeeping is needed. The answer depends on the front-initialisation convention (-1/10 or 0/9), which explains 'possible indices'. No catalog match."}, {"id": "d3fd200e4d245bfb-1C", "paper_id": "d3fd200e4d245bfb", "qno": "1C", "text": "Write a C program to define a structure Student containing another structure Date (for date of birth).\nRead and display the student details using nested structures. The structure should resemble the\nfollowing table:", "marks": 2, "co": "CO1", "cognitive_level": "Analysis", "topic": "Data structure fundamentals", "subtopic": "Nested structures", "difficulty": "Easy", "leetcode": [], "reason": "Define a nested C struct (Student containing Date), then read and print it. This is basic record definition and I/O. The referenced table was lost in extraction, so the exact fields are unknown; the tag is unaffected."}, {"id": "d3fd200e4d245bfb-2A", "paper_id": "d3fd200e4d245bfb", "qno": "2A", "text": "A college is developing a simple \"Smart Editor \" software for its students.\nIn the Smart Editor , students should be able to undo and redo text changes.As a software\ndeveloper, you are asked to analyze and illustrate how Stacks can be used in this application.\nQuestion:\ni. Explain how a Stack can be used to implement the Undo-Redo feature in the editor.Write short C\ncode snippets for implementation and explain how it will work.", "marks": 5, "co": "CO3", "cognitive_level": "Application", "topic": "Stack", "subtopic": "Push/pop/peek", "difficulty": "Medium", "leetcode": [], "reason": "Correct undo/redo code must coordinate two histories, transfer operations or states in the right direction, and invalidate redo history after a new edit. Naming stacks does not supply this application logic. The rubric rates combining familiar structures or adapting a known algorithm Medium; these obligations go beyond isolated push/pop snippets."}, {"id": "d3fd200e4d245bfb-2B", "paper_id": "d3fd200e4d245bfb", "qno": "2B", "text": "Consider the following example to create binary search tree:\n40, 20, 10, 30, 60, 50, 70.\nIllustrate with the above BST, how a null pointer is replaced to convert it into a double threaded\nbinary tree.", "marks": 3, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "Threaded tree construction", "difficulty": "Easy", "leetcode": [], "reason": "Build the BST from the given keys, then show how null left/right links become inorder predecessor/successor threads, with tag bits and a head node. This is a diagram trace. #94 does not require permanent threading, so no catalog match."}, {"id": "d3fd200e4d245bfb-2C", "paper_id": "d3fd200e4d245bfb", "qno": "2C", "text": "Assume that you are storing marks of students in 3 subjects.\nWrite a C program that:\ni. Takes the number of students as input.\nii. Dynamically allocates a 2D array using pointers.\niii. Accepts marks for each subject.Calculates and prints the average marks of each student using\nonly pointer arithmetic.", "marks": 2, "co": "CO1", "cognitive_level": "Application", "topic": "Data structure fundamentals", "subtopic": "Static/dynamic allocation", "difficulty": "Easy", "leetcode": [], "reason": "Allocate an n x 3 array with malloc, then read marks and compute row averages using pointer arithmetic. This is a routine dynamic allocation and pointer exercise with no algorithmic difficulty."}, {"id": "d3fd200e4d245bfb-3A", "paper_id": "d3fd200e4d245bfb", "qno": "3A", "text": "i. Write a function to perform the Fast Transpose computation of a given sparse matrix.\nii. Demonstrate complete step-by-step process to compute the transpose of the below given sparse\nmatrix given in Fig.Q.3A using the above function. Also show the contents of all the variables\n(row_terms and starting_pos) used during the computation process.", "marks": 5, "co": "CO1", "cognitive_level": "Application", "topic": "Sparse matrix/Polynomial", "subtopic": "Sparse transpose", "difficulty": "Medium", "leetcode": [], "reason": "Implement fast transpose on the triplet representation: count column terms into row_terms, prefix-sum them into starting_pos, then place each triplet. This is a standard algorithm with coupled index invariants. Part ii is a trace, but Fig.Q.3A was lost in extraction, so the matrix data is missing. No catalog match."}, {"id": "d3fd200e4d245bfb-3B", "paper_id": "d3fd200e4d245bfb", "qno": "3B", "text": "In a gaming leaderboard system, players' scores are organized in a Binary Search Tree (BST) to\nenable quick ranking and retrieval. Write an iterative function to insert a new player's score into the\nBST.\nInsert the score 65 into the following BST and illustrate the updated tree structure after insertion.", "marks": 3, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "BST insertion/deletion", "difficulty": "Easy", "leetcode": [{"id": 701, "title": "Insert into a Binary Search Tree", "slug": "insert-into-a-binary-search-tree"}], "reason": "Write iterative BST insertion (walk down with a parent pointer, then attach a leaf) and trace inserting 65. This is a familiar single operation. The given BST diagram was lost in extraction, so the trace cannot be checked. Direct match: #701."}, {"id": "d3fd200e4d245bfb-3C", "paper_id": "d3fd200e4d245bfb", "qno": "3C", "text": "With the help of the following code, justify why a stack is preferred over a queue in handling nested\nfunction calls during program execution. Also, explain the role of activation records (stack frames) in\nthis process\nvoid fun1() { printf(\"Inside fun1n\"); }\n\nvoid fun2() { fun1(); printf(\"Inside fun2n\"); }\nint main() { fun2(); printf(\"Inside mainn\"); }", "marks": 2, "co": "CO3", "cognitive_level": "Analysis", "topic": "Stack", "subtopic": "Push/pop/peek", "difficulty": "Easy", "leetcode": [], "reason": "Conceptual justification: nested calls return in LIFO order (main -> fun2 -> fun1, unwinding in reverse), and activation records are pushed on call and popped on return. The assessed point is stack versus queue behaviour; call tracing is secondary. Short explanation only."}, {"id": "d3fd200e4d245bfb-4A", "paper_id": "d3fd200e4d245bfb", "qno": "4A", "text": "A music streaming service keeps track of songs in a playlist using a singly linked list. Each node stores the\nfollowing details: SongID (integer), Title (string), Duration (in seconds).\nWrite a C program to perform the following operations:\nInsert songs into the playlist in the order they are added.\nRemove all songs whose duration is less than a user-specified value (Use head pointer for performing this\noperation).\nDisplay the updated playlist.\nInclude a main() function to demonstrate all functionalities.", "marks": 5, "co": "CO2", "cognitive_level": "Application", "topic": "Singly LL", "subtopic": "Insertion/deletion", "difficulty": "Easy", "leetcode": [], "reason": "Full program with tail insertion, deletion of every node below a duration threshold, and display. The decisive part is filtered deletion that handles consecutive head removals. These are familiar singly-list operations, so rated Easy at the lower boundary. The catalog has no remove-by-condition list problem; #707 is only a loose design analogy."}, {"id": "d3fd200e4d245bfb-4B", "paper_id": "d3fd200e4d245bfb", "qno": "4B", "text": "Build the expression tree for the given infix expression 8+4*2/(3+1)-5 . Clearly show all the\nintermediate steps", "marks": 3, "co": "CO4", "cognitive_level": "Application", "topic": "Trees", "subtopic": "Binary tree construction", "difficulty": "Easy", "leetcode": [], "reason": "Hand-construct the expression tree for one infix expression while respecting precedence, associativity and parentheses. The root is '-', with left subtree 8+((4*2)/(3+1)) and right child 5. This is a trace; operator/operand stack use is secondary. No catalog match."}, {"id": "d3fd200e4d245bfb-4C", "paper_id": "d3fd200e4d245bfb", "qno": "4C", "text": "You are provided with the array representation of a binary tree.\nArray Representation: [1, 4, 2, 10, 5, 9, 13] Array index starts with 1.\nUsing the given representation, apply your understanding of tree structures to answer the following:\ni. Construct the binary tree from the given array and determine the depth of node 9.\nii. State the formula to find the index of right child given the index of parent and use it to find the\nindex of right child of node 2.", "marks": 2, "co": "CO4", "cognitive_level": "Analysis", "topic": "Trees", "subtopic": "Binary tree properties", "difficulty": "Easy", "leetcode": [], "reason": "Apply the 1-indexed array-tree formulas: left child = 2i, right child = 2i+1. Node 9 is at index 6, depth 2 with the root at depth 0. Node 2 is at index 3, so its right child is index 7 (node 13). Direct formula application."}, {"id": "d3fd200e4d245bfb-5A", "paper_id": "d3fd200e4d245bfb", "qno": "5A", "text": "A small delivery network is represented as an undirected graph. The network has six hubs labelled\nA, B, C, D, E, F. The direct connections between hubs are: A-B, A-C, B-D, C-E, D-F, E-F, B-C, D-E\nNote: Whenever there is a choice between multiple unvisited neighbours in DFS or BFS, hubs\nshould be selected in alphabetical order.\ni. If a delivery inspection follows Depth First Search (DFS) starting from hub A, which hub will be\ninspected last? Explain your reasoning.\nii. If a delivery inspection follows Breadth First Search (BFS) starting from hub A, which hub is the\nfarthest from A in terms of the number of connections?\niii. Determine the number of connected subnetworks in this network.\nNow, remove the link E-F and D-F from the network. How many connected subnetworks exist after\nthese removals?\niv. If all connections become one-way (directed) in the order: A→ B→ D→F, A→C→E→F, B→C,\nD→ E, can DFS starting from A reach all hubs? Provide a brief explanation.\nv. Which change in the underlying data structure (queue ↔ stack) would make BFS behave like\n\nDFS?", "marks": 5, "co": "CO5", "cognitive_level": "Analysis", "topic": "Graphs", "subtopic": "DFS", "difficulty": "Easy", "leetcode": [], "reason": "Several short traces on a 6-vertex graph: DFS order (A,B,C,E,D,F, so F is last), BFS distance (F farthest at 3 edges), component count (1, and still 1 after removals with F isolated? No: removing E-F and D-F isolates F, giving 2), directed reachability (yes), and the queue-to-stack swap. DFS is the first substantive task; BFS, components and reachability are secondary. Pure hand simulation. #547 and #1971 implement these ideas but are not needed for a trace."}, {"id": "d3fd200e4d245bfb-5B", "paper_id": "d3fd200e4d245bfb", "qno": "5B", "text": "Develop a C program using a Doubly linked list to manage a queue system in a hospital, where\npatients can register, be served in order, or leave the queue.\nstruct Patient {\nint id;\nchar name [50];\nstruct Patient *next; };\nFunction prototypes:\nvoid registerPatient(int id, char name[])\nvoid servePatient() //as per queue order\nvoid removePatient(int id)", "marks": 3, "co": "CO2", "cognitive_level": "Application", "topic": "Doubly LL", "subtopic": "Insertion/deletion", "difficulty": "Medium", "leetcode": [{"id": 707, "title": "Design Linked List", "slug": "design-linked-list"}], "reason": "This program combines FIFO registration/service with deletion by arbitrary patient ID. It must keep both directions and the queue endpoints consistent for interior, head, tail, singleton and empty-list cases. The rubric assigns standard algorithms with several interacting cases Medium. Retain the existing caveat that the supplied struct omits prev; do not silently assume the contradictory representation is resolved."}, {"id": "d3fd200e4d245bfb-5C", "paper_id": "d3fd200e4d245bfb", "qno": "5C", "text": "Write a C function void rearrangeQueue(int queue[], int *front, int *rear) that rearranges the queue\nsuch that all even numbers appear before all odd numbers while preserving their original relative\norder within their respective groups (evens and odds).", "marks": 2, "co": "CO3", "cognitive_level": "Analysis", "topic": "Queue", "subtopic": "Linear queue", "difficulty": "Easy", "leetcode": [], "reason": "Stable even/odd partition of the elements between front and rear. A simple two-pass method with a temporary array is enough, and no in-place constraint is stated. The question does not say whether the queue is circular; a linear queue is assumed. #75 Sort Colors is not stable, so no match."}, {"id": "ac063325b357184c-1A", "paper_id": "ac063325b357184c", "qno": "1A", "text": "Explain the Tower of Hanoi problem. Develop a recursive function to solve it. What is the minimum\nnumber of moves required for n disks with dynamic allocation?", "marks": 4, "co": null, "cognitive_level": null, "topic": "Recursion", "subtopic": "Recursive implementation", "difficulty": "Easy", "leetcode": [], "reason": "Explain and write the standard three-peg recursive Tower of Hanoi, then state the minimum of 2^n - 1 moves. This is a textbook recursion. The phrase 'with dynamic allocation' looks like an extraction or wording artifact and adds no real requirement. The catalog has no Hanoi problem."}, {"id": "ac063325b357184c-1B", "paper_id": "ac063325b357184c", "qno": "1B", "text": "Create an array of structures to store information about multiple students with members for name, reg.\nno, subject name and marks. Develop a C program to find the student with the highest marks.", "marks": 4, "co": null, "cognitive_level": null, "topic": "Arrays/Strings", "subtopic": "Traversal", "difficulty": "Easy", "leetcode": [], "reason": "Declare an array of student structs and do one linear scan to find the highest marks. This is a basic traversal with no algorithmic difficulty, and the catalog has no comparable problem."}, {"id": "ac063325b357184c-1C", "paper_id": "ac063325b357184c", "qno": "1C", "text": "Compare the use of stacks in iterative solutions versus recursive solutions. When might one be\npreferred over the other?", "marks": 2, "co": null, "cognitive_level": null, "topic": "Recursion", "subtopic": "Recursion versus iteration", "difficulty": "Easy", "leetcode": [], "reason": "A conceptual comparison of the implicit call stack in recursion with an explicit stack in iterative code, covering overhead, stack-overflow depth and readability. It is a definition-level task. Stack is a secondary topic, but no stack operations are assessed."}, {"id": "ac063325b357184c-2A", "paper_id": "ac063325b357184c", "qno": "2A", "text": "Write a C program that does the following tasks:\ni) Define a function reverseArray that takes two parameters:\n\n• A pointer to an integer array.\n• An integer representing the size of the array.\n\nii) Inside reverseArray, use pointers to reverse the elements of the array\niii) In main, dynamically allocate an integer array of size 5, assign values 10, 20, 30, 40, 50 to the array,\nand call reverseArray() to reverse the elements.\n(1+2+1 = 4 marks)", "marks": 4, "co": null, "cognitive_level": null, "topic": "Arrays/Strings", "subtopic": "Two pointers", "difficulty": "Easy", "leetcode": [{"id": 344, "title": "Reverse String", "slug": "reverse-string"}], "reason": "Reverse an array in place by swapping through two pointers, with a malloc'd array in main (pointer and allocation basics are a secondary topic). It is a standard single operation. #344 uses the same in-place two-pointer reversal on a char array instead of an int array."}, {"id": "ac063325b357184c-2B", "paper_id": "ac063325b357184c", "qno": "2B", "text": "A hospital uses a priority queue to manage patient check-ins. Patients with higher priority (lower\nnumber) are attended to first. Implement a program to manage this queue using an array or linked list.\ni) Write a function insertPatient to add a new patient with a given priority into the priority queue while\nmaintaining the priority order.\nii) Write a function removeHighestPriority to remove the patient with the highest priority from the\nqueue.\niii) Using insertPatient, add patients with priorities 3, 1, 4, 2 and show the order of patients in the\nqueue after each insertion. Then, use removeHighestPriority to remove two patients, showing the order\nafter each removal.", "marks": 3, "co": null, "cognitive_level": null, "topic": "Queue", "subtopic": "Priority queue", "difficulty": "Medium", "leetcode": [], "reason": "The required program maintains a priority-ordered container across insertion and removal, rather than merely tracing dequeue order. Correct ordered insertion and highest-priority removal must agree on ordering and endpoint/empty cases. This fits a standard implementation with several invariants; no heap or optimal complexity requirement supports Hard."}, {"id": "ac063325b357184c-2C", "paper_id": "ac063325b357184c", "qno": "2C", "text": "A school maintains a linked list to keep track of students in the order they register for an event.\nImplement functions to manage this linked list.\ni) Write a function addStudent that takes a student's name and adds them to the end of the linked list.\nii) Write a function removeStudent that takes a student's name and removes the student from the list,\nupdating the list order.\niii) Use your functions to perform the following:\n\n• Add students \"Alice\", \"Bob\", \"Charlie\", and \"Diana\" in order, showing the list after each\naddition.\nRemove \"Bob\" and \"Charlie\" from the list, showing the list order after each removal.", "marks": 3, "co": null, "cognitive_level": null, "topic": "Singly LL", "subtopic": "Insertion/deletion", "difficulty": "Easy", "leetcode": [], "reason": "Write insert-at-end and delete-by-key for a linked list of names (no subtype stated, so assumed singly linked), then trace the given operations. These are familiar single operations. #707 uses index-based operations, not key-based deletion, so it is not a useful match."}, {"id": "ac063325b357184c-3A", "paper_id": "ac063325b357184c", "qno": "3A", "text": "Write a C program to construct an expression tree for the expression for the given postfix expression\nABCD ^*+ and to evaluate it.", "marks": 4, "co": null, "cognitive_level": null, "topic": "Trees", "subtopic": "Binary tree construction", "difficulty": "Medium", "leetcode": [{"id": 150, "title": "Evaluate Reverse Polish Notation", "slug": "evaluate-reverse-polish-notation"}], "reason": "Build an expression tree from postfix using a stack of node pointers (Stack is secondary), then evaluate it with a recursive postorder pass. The program combines two structures and needs operand values for the letters A-D. #150 is only a partial match: it uses the same postfix stack pattern but evaluates directly without building a tree."}, {"id": "ac063325b357184c-3B", "paper_id": "ac063325b357184c", "qno": "3B", "text": "Develop a recursive C function to create a binary search tree by inserting node at required position in\nthe tree. Use following function prototype: struct Node* createBST(struct Node* root, int item) where\nroot points to the root node of the binary search tree and item is the value to be inserted to the binary\nsearch tree.\nCreate the binary search tree by inserting following list of numbers by depicting the tree after each\ninsertion.\n40, 15, 55, 24, 32, 18, 75, 49", "marks": 4, "co": null, "cognitive_level": null, "topic": "Trees", "subtopic": "BST insertion/deletion", "difficulty": "Easy", "leetcode": [{"id": 701, "title": "Insert into a Binary Search Tree", "slug": "insert-into-a-binary-search-tree"}], "reason": "Write the standard recursive BST insertion with the given prototype and trace eight insertions. It is a familiar single operation plus hand simulation. #701 is the same operation."}, {"id": "ac063325b357184c-3C", "paper_id": "ac063325b357184c", "qno": "3C", "text": "Develop a user-defined C function to insert a node at the end of a circular doubly linked list with a\nheader node. Ensure that the function also maintains the count of nodes in the information field of the\nheader node. Use the following function prototype: void insertAtEndCDLL(struct Node *head, int\nitem) where head points to the header node and item refers to the value to be inserted.", "marks": 2, "co": null, "cognitive_level": null, "topic": "Circular LL", "subtopic": "Insertion/deletion", "difficulty": "Easy", "leetcode": [], "reason": "Insert at the end of a circular doubly linked list with a header node, using head->prev as the tail, relinking four pointers and incrementing the count in the header. The header removes empty-list special cases, so this is a single standard operation. The catalog has no circular-list problem."}, {"id": "ac063325b357184c-4A", "paper_id": "ac063325b357184c", "qno": "4A", "text": "Given a threaded binary tree, write a C program to implement a function search that searches for a given value in the tree. Define a structure for the nodes. Your function should take the root of the tree and key value to be searched as input, and efficiently utilize the threads to traverse the tree and find the specified value. If the value is found, the function should return a pointer to the node containing the value; otherwise, it should return NULL.\n[Fig. 4A: threaded binary tree with root 10; 10's children 5 and 20; 5's children 1 and 8; 20's children 15 and 25]\nDemonstrate how you can call this function search in main function, on a sample tree with nodes containing values 10, 5, 20, 1, 8, 15, and 25. Assume that the threaded binary tree is already created, and the threads are properly set up.", "marks": 4, "co": null, "cognitive_level": null, "from_image": true, "topic": "Trees", "subtopic": "Threaded tree traversal", "difficulty": "Medium", "leetcode": [], "reason": "Implementing search through threads requires defining link/tag semantics and correctly choosing between a successor thread and descent to the leftmost node of a real right subtree, including termination. These representation-dependent cases distinguish it from a basic recursive traversal. A prebuilt tree removes thread construction, but does not remove the multi-case traversal implementation."}, {"id": "ac063325b357184c-4B", "paper_id": "ac063325b357184c", "qno": "4B", "text": "Consider the following undirected graph represented using adjacency matrix:\n   A B C D E F G H\nA  0 1 1 0 0 0 0 0\nB  1 0 0 1 1 0 0 0\nC  1 0 0 0 0 1 0 0\nD  0 1 0 0 0 0 1 0\nE  0 1 0 0 0 0 0 0\nF  0 0 1 0 0 0 0 1\nG  0 0 0 1 0 0 0 1\nH  0 0 0 0 0 1 1 0\nDraw the corresponding graph and perform a Depth-First Search (DFS) traversal and Breadth-First Search (BFS) traversal, starting from node A. Write down the order in which the nodes are visited in both cases in form of table using the format: Step | Current Node | Stack/Queue | Action.\nClearly indicate the role of stack/queue or any backtracking that occurs during the traversal under 'Action'.", "marks": 4, "co": null, "cognitive_level": null, "from_image": true, "topic": "Graphs", " cy list for a 5-node directed graph whose seven edges are given in the figure description. It is direct representation work with no coding problem to match."}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const Q = D.questions, P = Object.fromEntries(D.papers.map(p=>[p.id,p]));
const DIFFS = ['Easy','Medium','Hard'];
const state = {topic:null, diff:null, paper:null};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = p => `${p.exam_type||''} ${(p.date||'').slice(0,7)}`.trim();

if (D.subject) { document.getElementById('h1').textContent = D.subject + ' question map'; document.title = D.subject_short || 'DS Question Map'; }
if (D.eyebrow) document.getElementById('eyebrow').textContent = D.eyebrow;
document.getElementById('papers').innerHTML = D.papers.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.code)} · ${esc(short(p))} ↗</a>`).join('');

function topics(){
  const m = {};
  for (const q of Q){ (m[q.topic] ??= {Easy:0,Medium:0,Hard:0,n:0}); m[q.topic][q.difficulty]++; m[q.topic].n++; }
  return Object.entries(m).sort((a,b)=>b[1].n-a[1].n);
}
function renderRows(){
  const t = topics(), max = t[0]?.[1].n || 1;
  document.getElementById('rows').innerHTML = t.map(([name,c])=>`
    <button class="row" data-t="${esc(name)}" aria-pressed="${state.topic===name}">
      <span class="name" title="${esc(name)}">${esc(name)}</span>
      <span class="bar" style="width:${(c.n/max*100).toFixed(1)}%">${DIFFS.map(d=>c[d]?`<span style="width:${c[d]/c.n*100}%;background:var(--${d==='Medium'?'med':d.toLowerCase()})" title="${c[d]} ${d}"></span>`:'').join('')}</span>
      <span class="n">${c.n} q</span>
    </button>`).join('');
}
function renderFilters(){
  const chip = (k,v,label) => `<button class="chip" data-k="${k}" data-v="${esc(v)}" aria-pressed="${state[k]===v}">${esc(label)}</button>`;
  document.getElementById('filters').innerHTML =
    `<span class="lab">Difficulty</span>${DIFFS.map(d=>chip('diff',d,d)).join('')}
     <span class="lab" style="margin-left:10px">Paper</span>${D.papers.map(p=>chip('paper',p.id,short(p))).join('')}
     <span class="count" id="count"></span>`;
}
function renderList(){
  const qs = Q.filter(q=>(!state.topic||q.topic===state.topic)&&(!state.diff||q.difficulty===state.diff)&&(!state.paper||q.paper_id===state.paper));
  document.getElementById('count').textContent = `${qs.length} of ${Q.length} questions`;
  const order = topics().map(t=>t[0]), g = {};
  for (const q of qs) (g[q.topic] ??= []).push(q);
  const html = order.filter(t=>g[t]).map(t=>`
    <div class="group"><h2>${esc(t)}<small>${g[t].length}</small></h2>
    ${g[t].map(q=>{ const p=P[q.paper_id]||{}; return `
      <details class="slip"><summary>
        <span class="qno">Q${esc(q.qno)}<small>${esc(short(p))}</small></span>
        <span class="gist"><span class="st">${esc(q.subtopic||q.topic)}</span><p>${esc(q.text)}</p></span>
        <span class="side"><span class="pill ${esc(q.difficulty)}">${esc(q.difficulty)}</span><span class="marks">${q.marks!=null?esc(q.marks)+' marks':''}</span></span>
      </summary>
      <div class="body">
        <p class="qtext">${esc(q.text)}</p>
        <div class="meta">${q.co?`<span>${esc(q.co)}</span>`:''}${q.cognitive_level?`<span>${esc(q.cognitive_level)}</span>`:''}<span>${esc(p.title||'')}</span></div>
        ${q.reason?`<p class="why">Why ${esc(q.difficulty)}: ${esc(q.reason)}</p>`:''}
        ${(q.leetcode||[]).length?`<div class="lc">${q.leetcode.map(l=>`<a href="https://leetcode.com/problems/${esc(l.slug)}/" target="_blank" rel="noopener">${esc(l.id)}. ${esc(l.title)} ↗</a>`).join('')}</div>`:''}
      </div></details>`}).join('')}
    </div>`).join('');
  document.getElementById('list').innerHTML = html || '<p class="empty">No questions match these filters. Clear one to see more.</p>';
}
function render(){ renderRows(); renderFilters(); renderList(); }
document.addEventListener('click', e=>{
  const r = e.target.closest('.row'); if (r){ state.topic = state.topic===r.dataset.t?null:r.dataset.t; render(); return; }
  const c = e.target.closest('.chip'); if (c){ const k=c.dataset.k,v=c.dataset.v; state[k]=state[k]===v?null:v; render(); }
});
render();
</script>
